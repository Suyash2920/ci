name: CD — QA

# Every merge into `qa` deploys to the qa Unity Catalog and runs the pipeline.
on:
  push:
    branches: [qa]
  workflow_dispatch:
    inputs:
      run_bootstrap:
        description: Also (re)create catalog, schemas and sample data
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cd-qa
  cancel-in-progress: false

jobs:
  deploy-qa:
    name: Deploy to QA catalog
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: qa
      bundle_target: qa
      run_job: true
      run_bootstrap: ${{ inputs.run_bootstrap == true }}
    secrets: inherit

  open-promotion-pr:
    name: Open promotion PR to main
    runs-on: ubuntu-latest
    needs: [deploy-qa]
    if: success() && github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Create or update the qa -> main promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --base main --head qa --state open --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            echo "Promotion PR #$existing already open."
          else
            gh pr create --base main --head qa \
              --title "Promote QA -> PROD ($(date -u +%Y-%m-%d))" \
              --body "Automated promotion PR. QA deployment succeeded for commit ${{ github.sha }}."
          fi
