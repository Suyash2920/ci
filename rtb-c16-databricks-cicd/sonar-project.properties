# SonarQube / SonarCloud configuration
# Replace projectKey / organization with the values shown in your Sonar UI.
sonar.projectKey=rtb-c16-databricks-cicd
sonar.projectName=RTB C16 Databricks CI/CD
sonar.projectVersion=1.0.0

# Uncomment for SonarCloud (not needed for a self-hosted SonarQube server)
# sonar.organization=your-sonarcloud-org

# Source layout
sonar.sources=src,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10,3.11

# Reports produced by the CI workflow
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results/junit.xml

# Noise reduction
sonar.exclusions=**/__pycache__/**,dist/**,build/**,.venv/**,ai-output/**,notebooks/**
sonar.coverage.exclusions=tests/**,scripts/genai/**,notebooks/**,**/__init__.py
sonar.cpd.exclusions=resources/**,tests/**

# Link analysis to the branch/PR so the "Clean as You Code" gate applies
sonar.scm.provider=git
