extends: default

rules:
  line-length:
    max: 140
    level: warning
  document-start: disable
  comments:
    min-spaces-from-content: 1
  truthy:
    # GitHub Actions uses `on:` as a key, which YAML 1.1 reads as a boolean.
    allowed-values: ["true", "false", "on"]
  braces:
    max-spaces-inside: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
